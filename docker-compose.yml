services:

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:17.11-alpine
    container_name: oleo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # =========================
  # API
  # =========================
  api-oleo-circular:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: api-oleo-circular
    restart: unless-stopped

    ports:
      - "127.0.0.1:3100:3000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s



volumes:
  postgres_data: