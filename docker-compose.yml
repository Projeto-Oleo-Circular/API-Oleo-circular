services:
  api-oleo-circular:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-oleo-circular
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"  
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s